<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Activity Input</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>

    <header class="main-header">
        <div class="header-container">
            <a href="index.html" class="brand">
                <i class="fas fa-leaf"></i>
                <span>Carbon Calculator</span>
            </a>
            <nav class="main-nav">
                <a href="index.html" class="nav-link">
                    <i class="fas fa-calculator"></i>
                    Calculator
                </a>
                <a href="dashboard.html" class="nav-link">
                    <i class="fas fa-chart-line"></i>

                <a href="register.html" class="nav-link" id="register-link">
                    <i class="fas fa-user-plus"></i>
                    Register
                </a>
            </nav>
        </div>
    </header>

    <main>
        <form id="activity-form">
            <label for="travel">Travel Distance (km):</label>
            <input type="number" id="travel" name="travel" required>

            <label for="electricity">Electricity Used (kWh):</label>
            <input type="number" id="electricity" name="electricity" required>

            <label for="food">Food Type:</label>
            <select id="food" name="food">
                <option value="vegetarian">Vegetarian</option>
                <option value="non-vegetarian">Non-Vegetarian</option>
            </select>

            <label for="plastic">Plastic Usage (kg):</label>
            <input type="number" id="plastic" name="plastic" required>

            <button type="submit">Submit</button>
        </form>
    </main>
